# Describes this repository in devhub (https://hub.dever.dk), dever-labs'
# developer portal. devhub's GitHub discovery reads this file from the
# default branch.
#   devhub/install  how to install it (Install card), <channel>:<id>, comma-separated
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: libraries
  namespace: devtools
  title: Libraries
  description: Packages dever-labs publishes for other code to depend on.
  annotations:
    github.com/project-slug: dever-labs/mongo-migrator
spec:
  owner: group:devtools/engineering
  domain: domain:devtools/devtools
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mongo-migrator
  namespace: devtools
  title: MongoMigrator
  description: >
    DeverLabs.MongoMigrator — versioned, idempotent, rollback-capable MongoDB
    migrations for .NET 8–11 that run on application startup.
  annotations:
    github.com/project-slug: dever-labs/mongo-migrator
    devhub/install: nuget:DeverLabs.MongoMigrator
  tags: [dotnet, csharp, mongodb]
  links:
    - url: https://www.nuget.org/packages/DeverLabs.MongoMigrator
      title: NuGet package
spec:
  type: library
  lifecycle: production
  owner: group:devtools/engineering
  system: system:devtools/libraries
